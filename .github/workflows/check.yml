name: wallet checks
# Pushes to main are checked by deploy.yml before deploying.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Repeat passes only on manual runs; PRs and pushes run each suite once.
  REPEAT: ${{ github.event_name == 'workflow_dispatch' && 3 || 1 }}
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Offline ask integration (repeated three times on manual runs)
        run: for run in $(seq "$REPEAT"); do npm run check:ask || exit 1; done
      - name: Negative controls and restored pass
        run: npm run check:ask:regression
      - name: Passkey PRF + 2-of-4 Safe + 2-of-2 Arkade/Lightning E2E
        run: npm run check:prf
