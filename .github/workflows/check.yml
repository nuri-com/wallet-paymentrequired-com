name: wallet checks
on:
  push:
    branches: [main, feat/wallet-ask-20261018]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Offline ask integration (three runs)
        run: for run in 1 2 3; do npm run check:ask || exit 1; done
      - name: Negative controls and restored pass
        run: npm run check:ask:regression
